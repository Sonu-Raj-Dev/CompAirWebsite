<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad1)"/>
  
  <!-- Compressor Body -->
  <rect x="150" y="200" width="300" height="200" rx="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Tank -->
  <ellipse cx="550" cy="300" rx="80" ry="60" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Motor -->
  <rect x="100" y="250" width="80" height="100" rx="10" fill="#6B7280" stroke="#374151" stroke-width="2"/>
  
  <!-- Control Panel -->
  <rect x="200" y="180" width="100" height="40" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
  <circle cx="220" cy="200" r="8" fill="#10B981"/>
  <circle cx="250" cy="200" r="6" fill="#F59E0B"/>
  <circle cx="280" cy="200" r="6" fill="#EF4444"/>
  
  <!-- Pipes -->
  <rect x="450" y="280" width="100" height="20" fill="#9CA3AF"/>
  <rect x="450" y="320" width="100" height="20" fill="#9CA3AF"/>
  
  <!-- CompAir Logo Area -->
  <rect x="50" y="50" width="200" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
  <text x="150" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">CompAir</text>
  <text x="150" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18">L45 V4</text>
  
  <!-- Specifications -->
  <rect x="500" y="450" width="250" height="120" fill="rgba(255,255,255,0.9)" rx="10"/>
  <text x="520" y="475" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Specifications:</text>
  <text x="520" y="495" fill="#374151" font-family="Arial, sans-serif" font-size="12">Motor: 45 kW</text>
  <text x="520" y="510" fill="#374151" font-family="Arial, sans-serif" font-size="12">Pressure: 7.5-13 bar</text>
  <text x="520" y="525" fill="#374151" font-family="Arial, sans-serif" font-size="12">Flow: 6.20-8.67 m³/min</text>
  <text x="520" y="540" fill="#374151" font-family="Arial, sans-serif" font-size="12">Noise: 69 dBA</text>
  <text x="520" y="555" fill="#374151" font-family="Arial, sans-serif" font-size="12">Weight: 1725 kg</text>
  
  <!-- Power Indicator -->
  <text x="400" y="550" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">45kW</text>
</svg>