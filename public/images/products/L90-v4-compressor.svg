<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338CA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad4)"/>
  
  <!-- Compressor Body (Variable Speed Design) -->
  <rect x="120" y="170" width="360" height="260" rx="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Tank -->
  <ellipse cx="580" cy="300" rx="95" ry="75" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Motor with VSD -->
  <rect x="70" y="220" width="95" height="130" rx="10" fill="#6B7280" stroke="#374151" stroke-width="2"/>
  <rect x="75" y="300" width="85" height="30" rx="5" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
  <text x="117" y="318" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">VSD</text>
  
  <!-- Advanced Control Panel -->
  <rect x="200" y="150" width="140" height="60" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="210" y="160" width="120" height="25" rx="3" fill="#1F2937"/>
  <circle cx="230" cy="195" r="8" fill="#10B981"/>
  <circle cx="260" cy="195" r="6" fill="#F59E0B"/>
  <circle cx="290" cy="195" r="6" fill="#EF4444"/>
  <circle cx="320" cy="195" r="6" fill="#3B82F6"/>
  
  <!-- Pipes -->
  <rect x="480" y="265" width="100" height="28" fill="#9CA3AF"/>
  <rect x="480" y="335" width="100" height="28" fill="#9CA3AF"/>
  
  <!-- CompAir Logo Area -->
  <rect x="50" y="50" width="200" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
  <text x="150" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">CompAir</text>
  <text x="150" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18">L90 V4 VSD</text>
  
  <!-- Specifications -->
  <rect x="480" y="450" width="270" height="130" fill="rgba(255,255,255,0.9)" rx="10"/>
  <text x="500" y="475" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Specifications:</text>
  <text x="500" y="495" fill="#374151" font-family="Arial, sans-serif" font-size="12">Motor: 90 kW (Variable Speed)</text>
  <text x="500" y="510" fill="#374151" font-family="Arial, sans-serif" font-size="12">Pressure: 7.5-13 bar</text>
  <text x="500" y="525" fill="#374151" font-family="Arial, sans-serif" font-size="12">Flow: 13.25-17.15 m³/min</text>
  <text x="500" y="540" fill="#374151" font-family="Arial, sans-serif" font-size="12">Noise: 74 dBA</text>
  <text x="500" y="555" fill="#374151" font-family="Arial, sans-serif" font-size="12">Weight: 2350 kg</text>
  
  <!-- Power Indicator -->
  <text x="400" y="550" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">90kW</text>
</svg>