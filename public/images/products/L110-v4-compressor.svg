<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad5)"/>
  
  <!-- Compressor Body (Premium Design) -->
  <rect x="110" y="160" width="380" height="280" rx="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Tank -->
  <ellipse cx="590" cy="300" rx="100" ry="80" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Premium Motor with VSD -->
  <rect x="60" y="210" width="100" height="140" rx="10" fill="#6B7280" stroke="#374151" stroke-width="2"/>
  <rect x="65" y="290" width="90" height="35" rx="5" fill="#8B5CF6" stroke="#7C3AED" stroke-width="1"/>
  <text x="110" y="310" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">VSD+</text>
  
  <!-- Premium Control Panel -->
  <rect x="200" y="140" width="160" height="70" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="210" y="150" width="140" height="30" rx="3" fill="#1F2937"/>
  <text x="280" y="168" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Smart Control</text>
  <circle cx="230" cy="195" r="8" fill="#10B981"/>
  <circle cx="260" cy="195" r="6" fill="#F59E0B"/>
  <circle cx="290" cy="195" r="6" fill="#EF4444"/>
  <circle cx="320" cy="195" r="6" fill="#3B82F6"/>
  <circle cx="350" cy="195" r="6" fill="#8B5CF6"/>
  
  <!-- Premium Pipes -->
  <rect x="490" y="260" width="100" height="30" fill="#9CA3AF"/>
  <rect x="490" y="340" width="100" height="30" fill="#9CA3AF"/>
  
  <!-- CompAir Logo Area -->
  <rect x="50" y="50" width="220" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
  <text x="160" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">CompAir</text>
  <text x="160" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18">L110 V4 Premium</text>
  
  <!-- Specifications -->
  <rect x="460" y="450" width="290" height="130" fill="rgba(255,255,255,0.9)" rx="10"/>
  <text x="480" y="475" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Specifications:</text>
  <text x="480" y="495" fill="#374151" font-family="Arial, sans-serif" font-size="12">Motor: 110 kW (Premium VSD)</text>
  <text x="480" y="510" fill="#374151" font-family="Arial, sans-serif" font-size="12">Pressure: 7.5-13 bar</text>
  <text x="480" y="525" fill="#374151" font-family="Arial, sans-serif" font-size="12">Flow: 16.25-20.95 m³/min</text>
  <text x="480" y="540" fill="#374151" font-family="Arial, sans-serif" font-size="12">Noise: 75 dBA</text>
  <text x="480" y="555" fill="#374151" font-family="Arial, sans-serif" font-size="12">Weight: 2550 kg</text>
  
  <!-- Power Indicator -->
  <text x="400" y="550" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">110kW</text>
</svg>