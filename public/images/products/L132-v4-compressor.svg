<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad6)"/>
  
  <!-- Compressor Body (Maximum Size) -->
  <rect x="100" y="150" width="400" height="300" rx="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Tank -->
  <ellipse cx="600" cy="300" rx="105" ry="85" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Maximum Power Motor with VSD -->
  <rect x="50" y="200" width="105" height="150" rx="10" fill="#6B7280" stroke="#374151" stroke-width="2"/>
  <rect x="55" y="280" width="95" height="40" rx="5" fill="#7C3AED" stroke="#6D28D9" stroke-width="1"/>
  <text x="102" y="303" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">MAX VSD</text>
  
  <!-- Industrial Control Panel -->
  <rect x="200" y="130" width="180" height="80" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="210" y="140" width="160" height="35" rx="3" fill="#1F2937"/>
  <text x="290" y="160" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Industrial Control</text>
  <circle cx="230" cy="190" r="8" fill="#10B981"/>
  <circle cx="260" cy="190" r="6" fill="#F59E0B"/>
  <circle cx="290" cy="190" r="6" fill="#EF4444"/>
  <circle cx="320" cy="190" r="6" fill="#3B82F6"/>
  <circle cx="350" cy="190" r="6" fill="#8B5CF6"/>
  <circle cx="230" cy="200" r="4" fill="#06B6D4"/>
  <circle cx="260" cy="200" r="4" fill="#84CC16"/>
  <circle cx="290" cy="200" r="4" fill="#F97316"/>
  
  <!-- Heavy Duty Pipes -->
  <rect x="500" y="255" width="100" height="35" fill="#9CA3AF"/>
  <rect x="500" y="345" width="100" height="35" fill="#9CA3AF"/>
  
  <!-- CompAir Logo Area -->
  <rect x="50" y="50" width="240" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
  <text x="170" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">CompAir</text>
  <text x="170" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18">L132 V4 Industrial</text>
  
  <!-- Specifications -->
  <rect x="440" y="450" width="310" height="130" fill="rgba(255,255,255,0.9)" rx="10"/>
  <text x="460" y="475" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Specifications:</text>
  <text x="460" y="495" fill="#374151" font-family="Arial, sans-serif" font-size="12">Motor: 132 kW (Industrial VSD)</text>
  <text x="460" y="510" fill="#374151" font-family="Arial, sans-serif" font-size="12">Pressure: 7.5-13 bar</text>
  <text x="460" y="525" fill="#374151" font-family="Arial, sans-serif" font-size="12">Flow: 19.45-24.79 m³/min</text>
  <text x="460" y="540" fill="#374151" font-family="Arial, sans-serif" font-size="12">Noise: 76 dBA</text>
  <text x="460" y="555" fill="#374151" font-family="Arial, sans-serif" font-size="12">Weight: 2764 kg</text>
  
  <!-- Power Indicator -->
  <text x="400" y="550" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">132kW</text>
</svg>